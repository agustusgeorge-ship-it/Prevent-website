<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get help | Prevent</title>

    <!--Import fonts and load Bootstrap-->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap");
    </style>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span>Prevent</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="dangers.html">Types of Danger</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="help.html">Get Help</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="form-page">
      <div class="section-heading">
        <p class="eyebrow">You do not have to handle this alone</p>
        <h1>Get help</h1>
        <p>
          Tell us a little about what is happening. This form is a starting
          point and a member of the support team will follow up.
        </p>
      </div>
      <form class="support-form" action="results.html" method="get">
        <input type="hidden" name="form" value="Get help"><label
          for="help-name"
          >Your name<input
            id="help-name"
            name="name"
            type="text"
            autocomplete="name"
            required></label
        ><label for="help-email"
          >Email address<input
            id="help-email"
            name="email"
            type="email"
            autocomplete="email"
            required></label
        ><label for="help-message"
          >How can we help?<textarea
            id="help-message"
            name="message"
            rows="6"
            required
          ></textarea></label
        ><button class="button button-primary" type="submit">
          Send request <span aria-hidden="true">→</span>
        </button>
      </form>
    </main>
    <footer class="site-footer">
      <div class="footer-main">
        <div class="footer-column">
          <h2>Contact</h2>
          <p>0800 011 2321</p>
          <p>info@prevent-support.org</p>
        </div>
        <a class="footer-report" href="report.html"
          >Report a situation <span aria-hidden="true">↗</span></a
        >
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
